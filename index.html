<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>월급 타이머 - 내 물건 사기 프로젝트</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* 폰트 및 기본 설정 */
        @import url('https://fonts.googleapis.com/css2?family=Pretendard:wght@400;600;800&display=swap');
        body {
            font-family: 'Pretendard', -apple-system, sans-serif;
            overflow: hidden; /* 지폐 날아가는 이펙트가 화면 밖으로 나가지 않도록 설정 */
            background-color: #f0f4f0; /* 눈이 편안한 세이지 그린/베이지 톤 배경 */
            color: #334155;
        }

        /* 화면 전환용 페이드 인/아웃 애니메이션 */
        .fade-in {
            animation: fadeIn 0.5s ease-in forwards;
        }
        .fade-out {
            animation: fadeOut 0.5s ease-out forwards;
        }
        @keyframes fadeIn {
            from { opacity: 0; visibility: hidden; transform: translateY(10px); }
            to { opacity: 1; visibility: visible; transform: translateY(0); }
        }
        @keyframes fadeOut {
            from { opacity: 1; visibility: visible; transform: translateY(0); }
            to { opacity: 0; visibility: hidden; transform: translateY(-10px); }
        }

        /* 화면 숨김 유틸리티 */
        .hidden-screen {
            display: none !important;
        }

        /* 지폐 날아가는 애니메이션 */
        .money-fly {
            position: absolute;
            font-size: 2rem;
            user-select: none;
            pointer-events: none;
            opacity: 0.8;
            animation: flyRight linear infinite;
        }
        @keyframes flyRight {
            from { transform: translateX(-100px) rotate(-15deg); }
            to { transform: translateX(120vw) rotate(15deg); }
        }

        /* 로딩 스피너 애니메이션 */
        .spinner {
            border: 4px solid rgba(0, 0, 0, 0.1);
            border-left-color: #10b981; /* Tailwind emerald-500 */
            border-radius: 50%;
            width: 50px;
            height: 50px;
            animation: spin 1s linear infinite;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body class="h-screen w-screen flex items-center justify-center relative">

    <!-- 화면 1: 정보 입력 화면 -->
    <div id="screen1" class="z-10 bg-white p-8 rounded-2xl shadow-xl w-11/12 max-w-md border border-emerald-100 fade-in">
        <h1 class="text-2xl font-bold mb-6 text-center text-slate-800">💸 목표 달성 타이머</h1>
        
        <div class="space-y-4">
            <div>
                <label class="block text-sm font-medium text-slate-600 mb-1">닉네임</label>
                <input type="text" id="inputNickname" placeholder="예: 직장인A" 
                    class="w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-lg text-slate-800 focus:outline-none focus:border-emerald-500 focus:ring-1 focus:ring-emerald-500 transition-colors">
            </div>
            <div>
                <label class="block text-sm font-medium text-slate-600 mb-1">월급 (원)</label>
                <input type="number" id="inputSalary" placeholder="예: 3000000" 
                    class="w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-lg text-slate-800 focus:outline-none focus:border-emerald-500 focus:ring-1 focus:ring-emerald-500 transition-colors">
                <p class="text-xs text-slate-500 mt-1">* 월 소정근로시간 209시간 기준</p>
            </div>
            <div>
                <label class="block text-sm font-medium text-slate-600 mb-1">사고 싶은 물건 이름</label>
                <input type="text" id="inputItemName" placeholder="예: 아이패드 프로" 
                    class="w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-lg text-slate-800 focus:outline-none focus:border-emerald-500 focus:ring-1 focus:ring-emerald-500 transition-colors">
            </div>
            <div>
                <label class="block text-sm font-medium text-slate-600 mb-1">사고 싶은 물건 가격 (원)</label>
                <input type="number" id="inputItemPrice" placeholder="예: 1500000" 
                    class="w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-lg text-slate-800 focus:outline-none focus:border-emerald-500 focus:ring-1 focus:ring-emerald-500 transition-colors">
            </div>
        </div>

        <button onclick="startCalculation()" 
            class="mt-8 w-full bg-emerald-500 hover:bg-emerald-600 text-white font-bold py-3 px-4 rounded-lg transition-all shadow-lg shadow-emerald-500/30 transform hover:-translate-y-0.5">
            계산 시작하기
        </button>
    </div>

    <!-- 화면 2: 로딩 화면 -->
    <div id="screen2" class="z-10 flex flex-col items-center justify-center hidden-screen fade-in text-center w-full px-4">
        <div class="spinner mb-6"></div>
        <h2 id="loadingText" class="text-xl md:text-2xl font-semibold text-slate-700 tracking-wide">
            계산중...
        </h2>
    </div>

    <!-- 화면 3: 결과 및 시각화 화면 -->
    <div id="screen3" class="z-10 flex flex-col items-center justify-center hidden-screen fade-in w-full h-full p-4 relative">
        <!-- 배경 지폐 이펙트 컨테이너 -->
        <div id="moneyContainer" class="absolute inset-0 pointer-events-none overflow-hidden z-0"></div>

        <!-- 결과 컨텐츠 (지폐 위로 올라오도록 z-index 설정) -->
        <div class="z-10 text-center bg-white/90 backdrop-blur-md p-8 md:p-12 rounded-3xl border border-emerald-100 shadow-xl max-w-2xl w-full">
            <h3 id="resultTitle" class="text-lg md:text-xl text-emerald-600 font-bold mb-2"></h3>
            <p class="text-sm md:text-base text-slate-500 mb-8">지금 이 순간에도 당신의 노동 가치는 쌓이고 있습니다.</p>
            
            <div class="bg-emerald-50 rounded-2xl p-6 mb-8 border border-emerald-100">
                <p class="text-sm text-emerald-700 mb-2">오늘 출근 후 번 돈 (실시간)</p>
                <div class="flex items-baseline justify-center space-x-2">
                    <span id="realtimeMoney" class="text-4xl md:text-6xl font-bold text-slate-800 font-mono tracking-tighter">0</span>
                    <span class="text-xl md:text-2xl text-emerald-600 font-semibold">원</span>
                </div>
            </div>

            <div class="bg-slate-50 rounded-xl p-4 inline-block border border-slate-100">
                <p id="resultSentence" class="text-base md:text-lg text-slate-700 font-medium leading-relaxed">
                    <!-- 결과 문구 출력 영역 -->
                </p>
            </div>
        </div>

        <!-- 하단으로 따로 뺀 다시 계산하기 버튼 -->
        <div class="absolute bottom-8 w-full flex justify-center z-20">
            <button onclick="resetGame()" class="px-6 py-2 bg-slate-200 hover:bg-slate-300 text-slate-700 font-medium rounded-full transition-colors shadow-sm">
                다시 계산하기 ↺
            </button>
        </div>
    </div>

    <script>
        // DOM 요소 가져오기
        const screen1 = document.getElementById('screen1');
        const screen2 = document.getElementById('screen2');
        const screen3 = document.getElementById('screen3');
        
        const inputNickname = document.getElementById('inputNickname');
        const inputSalary = document.getElementById('inputSalary');
        const inputItemName = document.getElementById('inputItemName');
        const inputItemPrice = document.getElementById('inputItemPrice');
        
        const loadingText = document.getElementById('loadingText');
        const resultTitle = document.getElementById('resultTitle');
        const realtimeMoney = document.getElementById('realtimeMoney');
        const resultSentence = document.getElementById('resultSentence');
        const moneyContainer = document.getElementById('moneyContainer');

        // 상태 변수
        let moneyInterval;
        let spawnInterval;
        let currentEarned = 0;
        let wagePerMillisecond = 0;
        let lastTime = 0;

        // 화면 전환 헬퍼 함수
        function switchScreen(hideElem, showElem) {
            hideElem.classList.remove('fade-in');
            hideElem.classList.add('fade-out');
            
            setTimeout(() => {
                hideElem.classList.add('hidden-screen');
                hideElem.classList.remove('fade-out');
                
                showElem.classList.remove('hidden-screen');
                showElem.classList.add('fade-in');
            }, 500); // CSS 애니메이션 시간(0.5초)과 일치
        }

        function startCalculation() {
            const nickname = inputNickname.value.trim() || '이름없는 직장인';
            const salary = parseInt(inputSalary.value);
            const itemName = inputItemName.value.trim() || '원하던 그 물건';
            const itemPrice = parseInt(inputItemPrice.value);

            if (!salary || !itemPrice || salary <= 0 || itemPrice <= 0) {
                alert('월급과 물건 가격을 정확한 숫자로 입력해주세요.');
                return;
            }

            // 1 -> 2 화면 전환 (로딩)
            loadingText.innerText = `'${nickname}'님의 '${itemName}' 구매까지 남은시간 계산중...`;
            switchScreen(screen1, screen2);

            // 급여 계산 로직 (월 소정근로시간 209시간 기준)
            const workHoursPerMonth = 209;
            const hourlyWage = salary / workHoursPerMonth;
            const wagePerSecond = hourlyWage / 3600;
            wagePerMillisecond = wagePerSecond / 1000;

            // 목표 금액까지 필요한 총 초(sec) 계산
            const totalSecondsNeeded = itemPrice / wagePerSecond;

            // 시, 분, 초 단위로 변환
            const hours = Math.floor(totalSecondsNeeded / 3600);
            const minutes = Math.floor((totalSecondsNeeded % 3600) / 60);
            const seconds = Math.floor(totalSecondsNeeded % 60);

            // 2.5초 후 2 -> 3 화면 전환 (결과)
            setTimeout(() => {
                switchScreen(screen2, screen3);
                
                // 결과 데이터 세팅
                resultTitle.innerText = `${nickname}님의 플렉스(Flex) 타임라인`;
                resultSentence.innerHTML = `당신은 <strong class="text-emerald-600 text-xl">${hours}</strong>시간 <strong class="text-emerald-600 text-xl">${minutes}</strong>분 <strong class="text-emerald-600 text-xl">${seconds}</strong>초 일을 하면<br><span class="font-bold text-emerald-700">'${itemName}'</span>을(를) 살 수 있습니다.`;
                
                // 실시간 돈 오르는 애니메이션 및 지폐 이펙트 시작
                startRealtimeCounter();
                startMoneyFlyingEffect();
            }, 2500);
        }

        function startRealtimeCounter() {
            currentEarned = 0;
            lastTime = performance.now();
            
            // requestAnimationFrame을 사용하여 부드럽게 숫자 카운팅
            function updateCounter(currentTime) {
                const deltaTime = currentTime - lastTime;
                lastTime = currentTime;
                
                // 경과된 시간만큼 번 돈 증가
                currentEarned += deltaTime * wagePerMillisecond;
                
                // 소수점 1자리까지 보여줘서 실시간으로 오르는 느낌 강조
                realtimeMoney.innerText = currentEarned.toLocaleString('ko-KR', { 
                    minimumFractionDigits: 1, 
                    maximumFractionDigits: 1 
                });
                
                moneyInterval = requestAnimationFrame(updateCounter);
            }
            moneyInterval = requestAnimationFrame(updateCounter);
        }

        function startMoneyFlyingEffect() {
            // 지폐 생성 함수
            function spawnMoney() {
                const money = document.createElement('div');
                money.classList.add('money-fly');
                money.innerText = '💵';
                
                // 랜덤 Y축 위치 (화면 높이의 10% ~ 90% 사이)
                const startY = Math.random() * 80 + 10;
                money.style.top = `${startY}%`;
                
                // 랜덤 크기 및 속도
                const scale = Math.random() * 0.5 + 0.8; // 0.8 ~ 1.3배
                const duration = Math.random() * 4 + 4; // 4초 ~ 8초 사이
                
                money.style.transform = `scale(${scale})`;
                money.style.animationDuration = `${duration}s`;
                
                moneyContainer.appendChild(money);
                
                // 애니메이션이 끝나면 DOM에서 제거 (메모리 누수 방지)
                setTimeout(() => {
                    money.remove();
                }, duration * 1000);
            }

            // 0.8초마다 새로운 지폐 생성
            spawnInterval = setInterval(spawnMoney, 800);
        }

        function resetGame() {
            // 초기화
            cancelAnimationFrame(moneyInterval);
            clearInterval(spawnInterval);
            moneyContainer.innerHTML = '';
            
            inputNickname.value = '';
            inputSalary.value = '';
            inputItemName.value = '';
            inputItemPrice.value = '';
            
            switchScreen(screen3, screen1);
        }
    </script>
</body>
</html>
